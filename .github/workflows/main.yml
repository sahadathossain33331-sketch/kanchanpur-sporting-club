name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Save Firebase configuration
        run: |
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/google-services.json
            echo "Firebase configuration saved."
          else
            echo "ERROR: android/app/google-services.json not found."
            exit 1
          fi

      - name: Save Flutter project files
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib

      - name: Recreate Android project
        run: |
          rm -rf android
          flutter create --platforms=android .

      - name: Restore Firebase configuration
        run: |
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json
          echo "Firebase configuration restored."

      - name: Restore application source
        run: |
          rm -rf lib
          cp -r /tmp/lib lib
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Configure Android package
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          app_file = None

          for file in candidates:
              if file.exists():
                  app_file = file
                  break

          if app_file is None:
              print("ERROR: Android app Gradle file was not found.")
              raise SystemExit(1)

          text = app_file.read_text()

          replacements = {
              "com.example.kanchanpur_sporting_club": "Com.Ksc",
              "com.example.kanchanpurSportingClub": "Com.Ksc",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          if app_file.name.endswith(".kts"):
              if 'id("com.google.gms.google-services")' not in text:
                  text = text.replace(
                      'id("dev.flutter.flutter-gradle-plugin")',
                      'id("dev.flutter.flutter-gradle-plugin")\n    id("com.google.gms.google-services")'
                  )
          else:
              if 'id "com.google.gms.google-services"' not in text:
                  text = text.replace(
                      'id "dev.flutter.flutter-gradle-plugin"',
                      'id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services"'
                  )

          app_file.write_text(text)

          print(f"Configured: {app_file}")
          PY

      - name: Configure Google Services plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/settings.gradle.kts"),
              Path("android/settings.gradle"),
          ]

          settings_file = None

          for file in candidates:
              if file.exists():
                  settings_file = file
                  break

          if settings_file is None:
              print("ERROR: Android settings.gradle file not found.")
              raise SystemExit(1)

          text = settings_file.read_text()

          if settings_file.name.endswith(".kts"):
              if 'id("com.google.gms.google-services")' not in text:
                  marker = 'id("org.jetbrains.kotlin.android")'
                  if marker in text:
                      text = text.replace(
                          marker,
                          marker + '\n    id("com.google.gms.google-services") version "4.4.4" apply false'
                      )
                  else:
                      print("ERROR: Kotlin Android plugin line not found.")
                      raise SystemExit(1)
          else:
              if 'id "com.google.gms.google-services"' not in text:
                  marker = 'id "org.jetbrains.kotlin.android"'
                  if marker in text:
                      text = text.replace(
                          marker,
                          marker + '\n    id "com.google.gms.google-services" version "4.4.4" apply false'
                      )
                  else:
                      print("ERROR: Kotlin Android plugin line not found.")
                      raise SystemExit(1)

          settings_file.write_text(text)

          print(f"Configured: {settings_file}")
          PY

      - name: Verify Firebase configuration
        run: |
          echo "===== Firebase configuration ====="
          ls -lh android/app/google-services.json

          echo "===== Android Gradle files ====="
          find android -maxdepth 2 -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Firebase SHA fingerprints
        run: |
          mkdir -p ~/.android

          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" || true

          echo "===== FIREBASE SHA FINGERPRINTS ====="

          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA1:|SHA256:"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kanchanpur-sporting-club-apk
          path: build/app/outputs/flutter-apk/app-release.apk
