
name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Save Firebase configuration
        run: |
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/google-services.json
            echo "Firebase configuration saved."
          else
            echo "ERROR: android/app/google-services.json not found."
            exit 1
          fi

      - name: Save Flutter project files
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib

      - name: Recreate Android project
        run: |
          rm -rf android
          flutter create --platforms=android .

      - name: Restore Firebase configuration
        run: |
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json
          echo "Firebase configuration restored."

      - name: Restore application source
        run: |
          rm -rf lib
          cp -r /tmp/lib lib
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Configure Android Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")

          if not settings.exists():
              print("ERROR: android/settings.gradle.kts not found.")
              raise SystemExit(1)

          text = settings.read_text()

          # Fix Kotlin Android plugin version
          kotlin_pattern = r'id\("org\.jetbrains\.kotlin\.android"\)(?:\s+version\s+"[^"]+")?(?:\s+apply\s+false)?'

          kotlin_replacement = (
              'id("org.jetbrains.kotlin.android") '
              'version "2.2.20" apply false'
          )

          if re.search(kotlin_pattern, text):
              text = re.sub(
                  kotlin_pattern,
                  kotlin_replacement,
                  text
              )
          else:
              # Add Kotlin plugin if it does not exist
              marker = 'plugins {'
              if marker in text:
                  text = text.replace(
                      marker,
                      marker + '\n    ' + kotlin_replacement,
                      1
                  )
              else:
                  text = (
                      'pluginManagement {\n'
                      '    repositories {\n'
                      '        google()\n'
                      '        mavenCentral()\n'
                      '        gradlePluginPortal()\n'
                      '    }\n'
                      '}\n\n'
                      'plugins {\n'
                      '    ' + kotlin_replacement + '\n'
                      '}\n\n'
                      + text
                  )

          # Add Google Services plugin with a fixed version
          google_plugin = (
              'id("com.google.gms.google-services") '
              'version "4.4.4" apply false'
          )

          if 'id("com.google.gms.google-services")' not in text:
              marker = 'plugins {'
              text = text.replace(
                  marker,
                  marker + '\n    ' + google_plugin,
                  1
              )
          else:
              google_pattern = (
                  r'id\("com\.google\.gms\.google-services"\)'
                  r'(?:\s+version\s+"[^"]+")?(?:\s+apply\s+false)?'
              )

              text = re.sub(
                  google_pattern,
                  google_plugin,
                  text
              )

          settings.write_text(text)

          print("===== FINAL settings.gradle.kts =====")
          print(text)
          PY

      - name: Configure Android application plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("android/app/build.gradle.kts")

          if not app.exists():
              print("ERROR: android/app/build.gradle.kts not found.")
              raise SystemExit(1)

          text = app.read_text()

          # Make sure Google Services plugin is applied
          if 'id("com.google.gms.google-services")' not in text:
              marker = 'plugins {'
              if marker in text:
                  text = text.replace(
                      marker,
                      marker + '\n    id("com.google.gms.google-services")',
                      1
                  )

          # Set package/application ID
          text = text.replace(
              'com.example.kanchanpur_sporting_club',
              'Com.Ksc'
          )

          text = text.replace(
              'com.example.kanchanpurSportingClub',
              'Com.Ksc'
          )

          app.write_text(text)

          print("===== FINAL android/app/build.gradle.kts =====")
          print(text)
          PY

      - name: Verify Firebase configuration
        run: |
          echo "===== Firebase file ====="
          ls -lh android/app/google-services.json

          echo "===== Android Gradle files ====="
          find android -maxdepth 2 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Generate Firebase SHA fingerprints
        run: |
          mkdir -p ~/.android

          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" || true

          echo "===== FIREBASE SHA FINGERPRINTS ====="

          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true

      - name: Build release APK
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kanchanpur-sporting-club-apk
          path: build/app/outputs/flutter-apk/app-release.apk

